[package]
name = "lycomc"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "lycomc — lilyco 命令面 + shadcn 桌面的 Minecraft 启动器（PCL 风）"

[dependencies]
lilyco = { git = "https://github.com/lilyco-42/lilyco", rev = "1fc383e44b51dbfe249562b4ca0ef5c271a712e9", features = ["tui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
include_dir = "0.7"
mime_guess = "2"
sha1 = "0.10"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
async-stream = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
directories = "6"
libc = "0.2"
zip = "2"
tokio-util = { version = "0.7", features = ["io"] }

[lib]
name = "lycomc"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "lycomc"
path = "src/main.rs"

[[example]]
name = "wry_min"
path = "examples/wry_min.rs"
required-features = ["desktop"]

# Web 优先（m06445）：默认只编译内核与 Web 控制台，不链接 GTK / WebView2 / WKWebView。
# 原生桌面壳降级为显式 cargo feature，避免它成为常规构建与维护负担。
[features]
default = []
desktop = ["dep:wry", "dep:tao", "dep:tray-icon", "dep:muda"]

# 桌面端：wry + tao + 托盘。Linux 的 GTK / AppIndicator 依赖单独按 target 拆开，
# 避免 Windows/macOS 交叉编译时被 Linux 专属 feature 拖进 GTK 与 libxdo。
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
wry = { version = "0.57", default-features = false, optional = true }
tao = { version = "0.37", default-features = false, features = ["rwh_06"], optional = true }
tray-icon = { version = "0.25", default-features = false, optional = true }
muda = { version = "0.20", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
wry = { version = "0.57", default-features = false, features = ["os-webview", "x11"], optional = true }
tao = { version = "0.37", default-features = false, features = ["rwh_06", "x11"], optional = true }
tray-icon = { version = "0.25", default-features = false, features = ["libappindicator"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[profile.dev]
opt-level = 0
incremental = true
codegen-units = 256
debug = 0
