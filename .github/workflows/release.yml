# 标签 v* 触发三平台默认 Web 可执行程序构建、运行时 smoke、SHA-256 与 GitHub Release。
# 这是「本机 Web 可执行程序」发布，不是原生桌面壳；桌面壳仍是可选 --features desktop。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（必须已存在）"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  guard:
    name: compile guard ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 构建 shadcn Web 前端
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # 全平台编译门禁：任一 target 编译失败就不启动昂贵的 release 打包矩阵。
      - name: 全目标编译检查（默认 Web feature）
        run: cargo check --locked --all-targets --target ${{ matrix.target }}

  build:
    name: build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: lycomc
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: lycomc.exe
            ext: zip
          - os: macos-15
            target: aarch64-apple-darwin
            bin: lycomc
            ext: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 构建 shadcn Web 前端
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 构建 release Web 可执行程序
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 运行时 smoke（临时数据目录，不打开浏览器）
        shell: bash
        run: |
          BIN="$PWD/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          bash scripts/runtime-smoke.sh "$BIN"

      - name: 打包与校验和
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          TAG="${{ inputs.tag || github.ref_name }}"
          ASSET="lycomc-${TAG}-${{ matrix.target }}.${{ matrix.ext }}"
          mkdir -p stage release
          cp "$BIN" stage/
          cp README.md stage/
          if [ "${{ matrix.ext }}" = "zip" ]; then
            STAGE_WIN="$(cygpath -w "$PWD/stage")"
            ASSET_WIN="$(cygpath -w "$PWD/$ASSET")"
            powershell.exe -NoProfile -Command "Compress-Archive -Path '$STAGE_WIN/*' -DestinationPath '$ASSET_WIN' -Force"
          else
            tar -czf "$ASSET" -C stage .
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          else
            openssl dgst -sha256 -r "$ASSET" | awk '{print $1 "  " $2}' > "$ASSET.sha256"
          fi
          mv "$ASSET" "$ASSET.sha256" release/
          ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: 创建/更新 Release 并上传产物与校验和
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          ls -lh dist/
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "LilyCraft Web $TAG" --generate-notes
          fi
