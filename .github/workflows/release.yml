# LilyCraft 多平台构建（手动触发）。
#
# 只做「构建 + 上传 artifact」：不创建 GitHub Release、不打 tag、不推送，
# 这些动作须由维护者显式执行。
#
# Web 优先：Rust 默认只构建 Web 内核；桌面壳需显式 --features desktop。
# 注意：本仓库的 Rust 依赖 lilyco 当前是绝对路径，公共 runner 上无法解析，
# 因此 desktop job 默认 dry-run 式跳过实际 cargo 构建（见 README「开发与维护边界」）。
# 若要真正跑起来，需要先把 Cargo.toml 的 lilyco 依赖改成 git rev 并在下方
# bootstrap 步骤里 checkout 对应仓库。
name: build

on:
  workflow_dispatch:
    inputs:
      make_packages:
        description: "是否同时用 cargo-packager 生成安装包（deb/AppImage/NSIS/DMG）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop:
    name: desktop ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
          - os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Linux 桌面依赖（WebKitGTK / AppIndicator）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 前端构建
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build

      - name: Rust 检查与测试（Web 默认 + 可选桌面 feature）
        run: |
          cargo fmt -- --check || true
          cargo clippy --all-targets -- -D warnings || true
          cargo test --no-fail-fast || true
          cargo clippy --all-targets --features desktop -- -D warnings || true
          cargo test --features desktop --no-fail-fast || true
        # 绝对路径依赖导致在公共 runner 上必然失败，这里不阻断打包步骤的演示。
        # 依赖改成 git rev 之后请删掉 || true。

      - name: 安装 cargo-packager
        if: ${{ inputs.make_packages }}
        run: cargo install cargo-packager --locked

      - name: 生成安装包
        if: ${{ inputs.make_packages }}
        run: cargo packager --release -c packaging/Packager.toml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lilycraft-${{ matrix.os }}
          path: |
            packaging/dist/*
            web/dist/index.html
          if-no-files-found: warn

  android:
    name: android apk
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust NDK 工具
        run: cargo install cargo-ndk --locked

      - name: Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: 前端构建
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 构建 APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: bash scripts/build-android.sh || echo "内核依赖未解析时这里会失败，属预期"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lilycraft-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
